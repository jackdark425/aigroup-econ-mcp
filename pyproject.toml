[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "aigroup_econ_mcp"
version = "2.0.9"
description = "Econometrics MCP server with regression, causal inference, time series, panel data, and statistical analysis workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AI Group", email = "jackdark425@gmail.com" }
]
license = { text = "MIT" }
keywords = [
    "mcp",
    "model-context-protocol",
    "econometrics",
    "statistics",
    "regression",
    "causal-inference",
    "time-series",
    "panel-data",
    "data-analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0,<2",
    "pydantic>=2.0,<3",
    "click>=8.0,<9",
    "PyYAML>=6.0,<7",
    "numpy>=1.24,<3",
    "pandas>=1.5,<3",
    "scipy>=1.10,<2",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.2,<2",
    "linearmodels>=5.0,<7",
    "arch>=6.0,<8",
    "xgboost>=1.7,<3",
    "lifelines>=0.27,<1",
    "libpysal>=4.7,<5",
    "esda>=2.4,<3",
    "spreg>=1.4,<2",
    "joblib>=1.2,<2",
    "openpyxl>=3.0,<4",
    "matplotlib>=3.5,<4",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
aigroup-econ-mcp = "aigroup_econ_mcp.cli:cli"

[project.urls]
Homepage = "https://github.com/jackdark425/aigroup-econ-mcp#readme"
Repository = "https://github.com/jackdark425/aigroup-econ-mcp.git"
Issues = "https://github.com/jackdark425/aigroup-econ-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["aigroup_econ_mcp", "econometrics", "tools"]
exclude = [
    "**/__pycache__",
    "**/*.py[co]",
    "**/.DS_Store",
    "**/tests",
    "**/test_*.py",
    "**/*_test.py",
    "**/test_report.md",
    "econometrics/**/README.md",
    "tools/**/README.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
    "/aigroup_econ_mcp",
    "/econometrics",
    "/tools",
    "/resources",
    "/docs",
]
exclude = [
    "**/__pycache__",
    "**/*.py[co]",
    "**/.DS_Store",
    "/test_results",
    "/test_data",
    "/tests",
    "/**/tests",
    "/**/quick_test.py",
    "/**/check_pypi_version.py",
    "/**/clear_uvx_cache.*",
    "/**/*_FIX_SUMMARY.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (common in this codebase)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
"econometrics/tests/*" = ["F401", "F403", "F405", "F811"]
"econometrics/**/test_*.py" = ["F401", "F403", "F405", "F811"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.5",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=5.0",
]
